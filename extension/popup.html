<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xtra DevPilot</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121214;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #a1a1aa;
      --text-bright: #ffffff;
      --btn-bg: #18181b;
      --btn-hover: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      font-size: 13px;
    }

    .container {
      background: var(--card-bg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .logo-img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      filter: grayscale(1);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      background: #18181b;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-weight: 500;
    }

    .status-badge.disconnected {
      color: #71717a;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #ffffff;
    }

    .disconnected .status-dot {
      background-color: #71717a;
    }

    #reconnectBtn {
      display: none;
      background: #18181b;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    #reconnectBtn:hover {
      background: var(--btn-hover);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.68rem;
      color: #71717a;
      margin-top: 3px;
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .quick-tools {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .tool-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease, border-color 0.15s ease;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: #ffffff;
      font-family: inherit;
    }
    .tool-btn:hover {
      background: var(--btn-hover);
      border-color: var(--border-hover);
    }

    /* Stop Automation Button */
    .btn-stop {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .btn-stop:hover {
      background: #e4e4e7;
      border-color: #e4e4e7;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: #71717a;
      width: 100%;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
    }
    .btn-secondary:hover {
      background: #18181b;
      color: #ffffff;
    }

    /* Toast Notification */
    #toast {
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      margin: 0 16px 8px 16px;
      text-align: center;
    }

    /* Code Modal / Output Box */
    #codeDrawer {
      display: none;
      margin: 0 16px 12px 16px;
      background: #121214;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    #codeDrawer textarea {
      width: 100%;
      height: 100px;
      background: #09090b;
      border: 1px solid var(--border);
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      outline: none;
      padding: 6px;
      border-radius: 4px;
    }
    .drawer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .btn-copy {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .footer {
      font-size: 0.7rem;
      color: #71717a;
      text-align: center;
      padding: 4px 0 14px 0;
    }
    .footer a {
      color: #ffffff;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <img src="icon.png" class="logo-img" alt="Logo">
        Xtra DevPilot
      </div>
      <div>
        <div id="statusIndicator" class="status-badge disconnected">
          <div class="status-dot"></div>
          <span id="statusText">Connecting...</span>
        </div>
        <button id="reconnectBtn">Connect Again</button>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="networkCount">0</div>
        <div class="stat-label">Network Logs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="consoleCount">0</div>
        <div class="stat-label">Console Logs</div>
      </div>
    </div>
  </div>

  <div class="quick-tools">
    <!-- Stop Automation Button -->
    <button id="stopAllBtn" class="tool-btn btn-stop">
      <span style="display: flex; align-items: center; gap: 6px;">
        <span style="display:inline-block; width: 6px; height: 6px; background: #000000; border-radius: 1px;"></span>
        Stop Browser Automation
      </span>
      <span style="font-size: 0.72rem; opacity: 0.7;">Halt</span>
    </button>

    <div class="section-title" style="margin-top: 6px;">
      Developer & QA Tools
    </div>

    <!-- 1-Click Profile Autofill -->
    <button id="autofillBtn" class="tool-btn">
      <span>Autofill Form Profile</span>
      <span style="font-size: 0.72rem; color: #71717a;">Om Salunke</span>
    </button>

    <!-- Playwright Test Recorder -->
    <button id="recordPlaywrightBtn" class="tool-btn">
      <span id="recordBtnText">Record Playwright Test</span>
      <span id="recordBadge" style="font-size: 0.72rem; color: #71717a;">Start</span>
    </button>

    <!-- Scrape Table/Cards to JSON -->
    <button id="scrapeTableBtn" class="tool-btn">
      <span>Scrape Table to JSON</span>
      <span style="font-size: 0.72rem; color: #71717a;">Export</span>
    </button>

    <!-- Toggle Layout Debugger -->
    <button id="toggleLayoutBtn" class="tool-btn">
      <span>Toggle Layout Debugger</span>
      <span style="font-size: 0.72rem; color: #71717a;">Outlines</span>
    </button>

    <!-- Select Element for AI -->
    <button id="selectElementBtn" class="tool-btn">
      <span>Inspect Element for IDE</span>
      <span style="font-size: 0.72rem; color: #71717a;">Select</span>
    </button>

    <div style="margin-top: 4px;">
      <button id="manageExtensionBtn" class="btn-secondary">
        Manage Extensions
      </button>
    </div>
  </div>

  <!-- Output & Script Drawer -->
  <div id="codeDrawer">
    <div style="font-size: 0.7rem; color: #71717a; margin-bottom: 4px;" id="drawerTitle">Generated Output:</div>
    <textarea id="drawerText" readonly></textarea>
    <div class="drawer-actions">
      <button id="copyDrawerBtn" class="btn-copy">Copy</button>
      <button id="closeDrawerBtn" style="background: transparent; border: none; color: #71717a; cursor: pointer; font-size: 0.72rem;">Close</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <div class="footer">
    Bridge Active • <a href="#" id="refreshBtn">Refresh</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
